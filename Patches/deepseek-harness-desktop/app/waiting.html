<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSeek Harness</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #1e1e1e; color: #d4d4d4; font-family: system-ui, sans-serif; }
  main { max-width: 34em; padding: 2em; line-height: 1.7; }
  h1 { font-size: 1.3em; }
  code { background: #2d2d2d; border-radius: 4px; padding: 0.1em 0.4em; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <section id="waiting">
    <h1>等待本地 DeepSeek Harness 服务</h1>
    <p>桌面壳已就绪，正在启动 <code>dsh web</code> 并获取本次会话地址。</p>
    <p>若长时间无响应，可在终端执行 <code>deepseek-harness-desktop serve</code> 查看服务状态。</p>
  </section>
  <section id="spawn-failed" class="hidden">
    <h1>自动启动后端失败</h1>
    <p>桌面壳无法拉起 <code>dsh web</code>。请检查弱沙箱 ACL 和宿主环境，然后执行：</p>
    <p><code>deepseek-harness-desktop install</code></p>
  </section>
  <section id="not-configured" class="hidden">
    <h1>尚未完成安装配置</h1>
    <p>壳内还没有服务连接参数。请在终端执行 <code>deepseek-harness-desktop install</code> 完成签名安装。</p>
  </section>
</main>
<script>
  var hash = location.hash.replace('#', '');
  if (hash === 'not-configured') {
    document.getElementById('waiting').className = 'hidden';
    document.getElementById('not-configured').className = '';
  } else if (hash === 'spawn-failed') {
    document.getElementById('waiting').className = 'hidden';
    document.getElementById('spawn-failed').className = '';
  }
</script>
</body>
</html>
