name: sync-ci-image

# Mirror the OHOS ci-runner image from Huawei Cloud SWR (cn-north-4) to GHCR.
# Every workflow's "Start OHOS container" step used to pay a ~3.5min
# cross-Pacific `docker pull` (SWR Beijing -> Azure-hosted runner, ~10MB/s on
# the big layer); GHCR sits on the same Azure backbone as the runners, so the
# pull drops to seconds. Copy the upstream image without adding layers,
# preserving its manifest digest and installed packages.
#
# Runs two ways:
#   - scheduled (daily): compares the upstream `latest` manifest digest to the
#     CI_RUNNER_UPSTREAM_DIGEST variable and the current mirror pin.
#     On a sync it auto-re-pins OHOS_CI_IMAGE (digest-pinned) and opens an
#     issue so a silent image change is visible.
#   - manual dispatch: force a copy from an explicit source/tag (the original
#     on-demand path); it does NOT touch the tracking variable.
#
# Secrets used: BOT_PUSH_TOKEN (PAT with repo scope — needed because setting
# repo variables / opening issues needs Administration, which the default
# GITHUB_TOKEN can't be granted). GITHUB_TOKEN is enough for the GHCR push
# itself (packages: write).

on:
  schedule:
    # 02:30 CST daily — runs well before the 04:30 CST daily-regression so a
    # freshly mirrored image is already in place if upstream changed.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source image on SWR (tag or @digest)'
        required: true
        default: 'swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest'
      tag:
        description: 'Tag to push as ghcr.io/social4hyq/ci-runner:<tag>'
        required: true

permissions:
  contents: read
  packages: write
  issues: write

# A scheduled and a manual sync (or two overlapping scheduled runs) building
# the same image race and waste runner minutes; they also both re-pin the
# variable. Serialize them per-workflow.
concurrency:
  group: sync-ci-image
  cancel-in-progress: false

env:
  # Rolling upstream tag the auto-check compares against.
  UPSTREAM: swr.cn-north-4.myhuaweicloud.com/harmonybrew/ci-runner:latest

jobs:
  # Decide whether a sync is needed. A manual dispatch always proceeds (using
  # the supplied source/tag verbatim). The scheduled run compares the upstream
  # `latest` manifest digest to the CI_RUNNER_UPSTREAM_DIGEST variable, which
  # records the exact upstream digest last mirrored to GHCR.
  # Check both variables so an existing derived image is replaced even
  # when the recorded upstream digest has not changed.
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      upstream_digest: ${{ steps.cmp.outputs.upstream_digest }}
      source: ${{ steps.cmp.outputs.source }}
      tag: ${{ steps.cmp.outputs.tag }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; skipping digest check."
            {
              printf 'changed=true\n'
              printf 'source=${{ inputs.source }}\n'
              printf 'tag=${{ inputs.tag }}\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIGEST=$(docker manifest inspect --verbose "$UPSTREAM" \
            | jq -r '.Descriptor.digest // empty')
          if [ -z "$DIGEST" ]; then
            echo "::warning::could not resolve upstream manifest digest; skipping"
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "upstream latest digest: $DIGEST"

          LAST=$(gh variable get CI_RUNNER_UPSTREAM_DIGEST --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
          echo "last synced digest: ${LAST:-<none — first run, will bootstrap>}"

          CURRENT=$(gh variable get OHOS_CI_IMAGE --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
          if [ "$DIGEST" = "$LAST" ] && [ "$CURRENT" = "ghcr.io/social4hyq/ci-runner@$DIGEST" ]; then
            echo "Upstream unchanged; nothing to sync."
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changed ($LAST -> $DIGEST); will sync."
            repo="${UPSTREAM%:*}"
            # Pin the copy to the exact verified digest, not the moving
            # 'latest' tag, so it can't drift between this check and the pull.
            {
              printf 'changed=true\n'
              printf 'upstream_digest=%s\n' "$DIGEST"
              printf 'source=%s@%s\n' "$repo" "$DIGEST"
              short="${DIGEST#sha256:}"
              printf 'tag=auto-%s-%s\n' "$(date -u +%Y%m%d)" "${short:0:12}"
            } >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install image copy tool
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Copy upstream image without changes
        id: mirror
        env:
          SOURCE: ${{ needs.check.outputs.source }}
          DEST: ghcr.io/social4hyq/ci-runner:${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST=$(skopeo inspect --raw "docker://$SOURCE" | sha256sum | cut -d ' ' -f 1)
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$SOURCE" "docker://$DEST"
          printf 'source_digest=sha256:%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Pin OHOS_CI_IMAGE + record upstream digest
        id: pin
        env:
          GH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN }}
          DEST: ghcr.io/social4hyq/ci-runner:${{ needs.check.outputs.tag }}
          UPSTREAM_DIGEST: ${{ needs.check.outputs.upstream_digest }}
          SOURCE_DIGEST: ${{ steps.mirror.outputs.source_digest }}
        run: |
          set -euo pipefail
          DIGEST=$(skopeo inspect --raw --authfile "$HOME/.docker/config.json" "docker://$DEST" \
            | sha256sum | cut -d ' ' -f 1)
          DIGEST="sha256:$DIGEST"
          if [ "$DIGEST" != "$SOURCE_DIGEST" ]; then
            echo "::error::source and mirror digests differ; OHOS_CI_IMAGE left unchanged"
            exit 1
          fi
          echo "new GHCR digest: $DIGEST"
          gh variable set OHOS_CI_IMAGE --repo "$GITHUB_REPOSITORY" \
            --body "ghcr.io/social4hyq/ci-runner@${DIGEST}"
          # Only record the upstream digest on an auto (scheduled) run; a
          # manual dispatch may copy from an arbitrary tag/digest.
          if [ -n "$UPSTREAM_DIGEST" ]; then
            gh variable set CI_RUNNER_UPSTREAM_DIGEST --repo "$GITHUB_REPOSITORY" \
              --body "$UPSTREAM_DIGEST"
          fi
          printf 'ghcr_digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Show pushed digest
        run: docker buildx imagetools inspect ghcr.io/social4hyq/ci-runner:${{ needs.check.outputs.tag }}

      # Auto-syncs (and only those) open an issue so a silent image change is
      # visible; manual dispatches don't, since the operator ran them directly.
      - name: Notify on auto-sync
        if: needs.check.outputs.upstream_digest != ''
        env:
          GH_TOKEN: ${{ secrets.BOT_PUSH_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "ci-image auto-synced to ${{ needs.check.outputs.tag }}" \
            --label ci-image \
            --body "Upstream \`ci-runner\` changed; copied the upstream image unchanged and re-pinned \`OHOS_CI_IMAGE\`.

          - upstream digest: \`${{ needs.check.outputs.upstream_digest }}\`
          - new image: \`ghcr.io/social4hyq/ci-runner@${{ steps.pin.outputs.ghcr_digest }}\` (tag \`${{ needs.check.outputs.tag }}\`)
          - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          (Auto-generated by the sync-ci-image scheduled check.)"
