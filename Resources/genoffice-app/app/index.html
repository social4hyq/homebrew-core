<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GenOffice runtime probe</title>
    <style>
      body { font: 13px/1.4 monospace; margin: 12px; }
      pre { white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h3>GenOffice runtime probe</h3>
    <p>renderer</p>
    <pre id="renderer">collecting…</pre>
    <p>main process</p>
    <pre id="main">collecting…</pre>
    <script>
      // What the GenOffice renderers need from the web engine: WebAssembly (pdfium,
      // rhwp), WebGL2 and canvas text measurement (docs layout), and the clipboard.
      function webgl2() {
        try {
          return Boolean(document.createElement('canvas').getContext('webgl2'))
        } catch (error) {
          return `ERR ${error.message}`
        }
      }
      function canvas2d() {
        try {
          const context = document.createElement('canvas').getContext('2d')
          return context.measureText('GenOffice').width > 0
        } catch (error) {
          return `ERR ${error.message}`
        }
      }
      const info = {
        userAgent: navigator.userAgent,
        webAssembly: typeof WebAssembly,
        webgl2: webgl2(),
        canvas2d: canvas2d(),
        clipboardApi: typeof navigator.clipboard,
        devicePixelRatio: window.devicePixelRatio,
        language: navigator.language,
      }
      document.getElementById('renderer').textContent = JSON.stringify(info, null, 2)
      fetch('http://127.0.0.1:18765/renderer', { method: 'POST', mode: 'no-cors', body: JSON.stringify(info) }).catch(
        () => {},
      )
    </script>
  </body>
</html>
