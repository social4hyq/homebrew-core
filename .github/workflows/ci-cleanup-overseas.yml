name: ci-cleanup-overseas

# THROWAWAY: delete the atomgit releases left by the overseas-hedge validation
# runs. Delete this workflow and its branch afterwards.
on:
  push:
    branches: ['ci/cleanup-overseas']

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  API: https://atomgit.com/api/v5/repos/social4hyq/homebrew-core
  ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
  TAGS: claude-code-app-v5.11492.5-r7 genoffice-v0.13.18-r2

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete tags (cascades release + assets)
        run: |
          for t in $TAGS; do
            printf '%s -> %s\n' "$t" \
              "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $ATOMGIT_TOKEN" "$API/tags/$t")"
          done
