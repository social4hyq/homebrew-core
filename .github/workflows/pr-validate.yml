name: pr-validate

# PR-driven CI: audit + source build + brew test for any formula added or
# changed in a pull request (new formula and version bumps both land here).
#
# 2026-07-20: build now really publishes (upload=true) with the bottle
# commit pushed back onto the PR's OWN branch (push_ref = head.ref), not
# just a build+test dry run — so by the time a human merges the PR, main
# already receives a formula that has its bottle. That push retriggers this
# workflow (a new commit landed on the PR branch); detect-changes.sh
# recognizes its own bottle write-back commit and short-circuits to an empty
# build/changed/heavy set, so the second run is fast and does nothing.
# Sets/clears the ci-passed label from the real gate state: the label job runs
# with `if: always()` and both adds and removes the label, so a failing run
# never leaves a stale green label behind. It also withholds ci-passed when any
# commit in the PR has a failing gate check — a bottle write-back commit
# re-triggers this workflow with light-check/build skipped, which otherwise
# launders a failed PR into ci-passed.
#
# lint-commits (adapted from Harmonybrew/ci's _check_commit_message):
# validates every human commit's first line against this tap's convention
# (new formula / version bump / revision bump / fix — see
# lint-commit-messages.sh), skipping CI's own bottle write-back commits.
#
# gate-report (adapted from Harmonybrew/homebrew-core's HarmonybrewBot gate-
# check report, see atomgit.com/Harmonybrew/homebrew-core/pull/18194): posts
# one upfront PR comment with commit count / formula count / commit-message
# format, so contributors get fast readable feedback instead of digging into
# job summaries. Comment-only, never gates ci-passed on its own — but build
# itself now waits on lint-commits (previously ran in parallel), so a bad
# commit message skips the expensive build instead of burning CI on it.

on:
  pull_request:
    branches: [main]
    paths: ['Formula/**', 'Patches/**', 'Resources/**',
            '.github/scripts/check-hap-formulae.py', '.github/scripts/test-hap-install-lib.sh',
            '.github/scripts/detect-changes.sh', '.github/scripts/test-detect-changes.sh',
            '.github/scripts/test-waiting-page.sh', '.github/scripts/publish.sh',
            '.github/scripts/set-ci-label.sh']

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  # false, not true: a multi-formula PR's build job pushes one bottle commit
  # per formula, each retriggering this workflow (synchronize). With
  # cancel-in-progress true, formula B's self-triggered run would cancel the
  # still-running matrix job mid-flight while formula A's push landed and
  # formula B's build was still going — corrupting the in-progress publish.
  # Queuing instead of canceling costs a little CI time on rapid pushes but
  # never kills a real build.
  cancel-in-progress: false

env:
  # Space-separated; heavy formulae are light-checked in PRs but never
  # auto-built here (even post-merge) — publishing them stays a manual
  # dispatch of bottle-build.yml. Currently empty: every formula auto-builds
  # in PRs like any other (llvm@21's ~62min build is accepted; keep this
  # mechanism for future outliers).
  HEAVY_FORMULAS: ""
  IMAGE: ${{ vars.OHOS_CI_IMAGE }} # unchanged mirror of the SWR ci-runner — see sync-ci-image.yml
  CONTAINER: ohos
  TAP_IN_CONTAINER: /storage/Users/currentUser/.harmonybrew/Homebrew/Library/Taps/social4hyq/homebrew-core

jobs:
  lint-commits:
    # Independent of detect: this checks commit-message hygiene, not which
    # formulae changed, so it runs regardless of what detect finds.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/lint-commit-messages.sh

  hap-checks:
    # Independent of detect, like lint-commits: cheap static checks of the HAP
    # app formulae, a standalone test of the shared install library and a test
    # of change detection itself, so a mistake fails in seconds instead of
    # after a 20-minute build.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check HAP app formulae
        run: python3 .github/scripts/check-hap-formulae.py
      - name: Test the shared install library
        run: .github/scripts/test-hap-install-lib.sh
      - name: Test change detection
        run: .github/scripts/test-detect-changes.sh
      - name: Test the shared waiting page
        run: .github/scripts/test-waiting-page.sh

  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      changed: ${{ steps.diff.outputs.changed }}
      heavy: ${{ steps.diff.outputs.heavy }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed formulae
        id: diff
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/detect-changes.sh
      - name: Resolve per-formula CI images
        id: images
        env:
          BUILD_JSON: ${{ steps.diff.outputs.build }}
          OVERRIDES: ${{ vars.OHOS_CI_IMAGE_OVERRIDES }}
        run: python3 .github/scripts/resolve-ci-images.py

  light-check:
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CHANGED_JSON: ${{ needs.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start OHOS container
        run: .github/scripts/setup-container.sh
      - name: readall + audit
        run: .github/scripts/light-check.sh

  gate-report:
    # Comment-only reflection of detect + lint-commits' output; runs
    # regardless of lint-commits passing (always()) so the report itself
    # shows up even on a failing PR.
    needs: [detect, lint-commits]
    if: always() && needs.detect.outputs.changed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Post gate-check report comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          CHANGED_JSON: ${{ needs.detect.outputs.changed }}
          LINT_RESULT: ${{ needs.lint-commits.result }}
        run: .github/scripts/gate-report-comment.sh

  build:
    # bottle-build declares contents:write at its top level; a called
    # workflow may not exceed the caller's permissions, so this must grant
    # it (2026-07-20: an omitted grant here causes a parse-time
    # startup_failure with zero jobs created, not a runtime failure —
    # verified via a throwaway debug branch). Needed for real now too:
    # upload=true pushes the bottle commit back to the PR branch.
    # packages:read is for private per-formula CI images (bottle-build's
    # `image` input): the called workflow's GITHUB_TOKEN can only pull them
    # when the caller grants this scope.
    permissions:
      contents: write
      packages: read
    needs: [detect, lint-commits, hap-checks]
    if: needs.detect.outputs.build != '[]' && needs.lint-commits.result == 'success' && needs.hap-checks.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        formula: ${{ fromJSON(needs.detect.outputs.build) }}
    uses: ./.github/workflows/bottle-build.yml
    with:
      formula: ${{ matrix.formula }}
      upload: true
      push_ref: ${{ github.event.pull_request.head.ref }}
      # Empty for formulae without an OHOS_CI_IMAGE_OVERRIDES entry;
      # bottle-build then falls back to the default OHOS_CI_IMAGE.
      image: ${{ fromJSON(needs.detect.outputs.images)[matrix.formula] }}
    secrets: inherit

  upstream-diff:
    # Informational only (adapted from Harmonybrew/ci's
    # _fetch_upstream_formula_diff, but pointed at Harmonybrew/homebrew-core
    # — our actual migration target per README, not the official
    # Homebrew/homebrew-core): for any formula in this PR that's genuinely
    # new (didn't exist at base), fetch the same-named formula via the
    # atomgit contents API and post a diff as a PR comment. Never gates
    # ci-passed — not in label's needs.
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Post upstream diff comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CHANGED_JSON: ${{ needs.detect.outputs.changed }}
        run: .github/scripts/upstream-diff-comment.sh

  label:
    needs: [lint-commits, hap-checks, detect, light-check, build]
    # Always run so a failing run clears a stale ci-passed label (force-push,
    # rerun and bottle write-back all used to leave a green label on a red PR).
    # The script does the real gating: current-run results plus a history check
    # of every commit's gate checks, which catches the bottle write-back
    # self-trigger whose light-check/build are skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set ci-passed label from real gate state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LINT: ${{ needs.lint-commits.result }}
          HAP: ${{ needs.hap-checks.result }}
          DETECT: ${{ needs.detect.result }}
          LIGHT: ${{ needs.light-check.result }}
          BUILD: ${{ needs.build.result }}
        run: .github/scripts/set-ci-label.sh
